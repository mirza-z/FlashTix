services:
  postgres:
    image: postgres:17
    container_name: flashtix-postgres
    environment:
      POSTGRES_USER: flashtix
      POSTGRES_PASSWORD: flashtix_dev
      POSTGRES_DB: flashtix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashtix -d flashtix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flashtix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: